<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — GLB + baked GI lightmap</title>
  <link rel="icon" href="data:," />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #202020;
      font-family: Arial, sans-serif;
    }

    #startBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 12px;
      background: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 60px 60px 60px;
      gap: 10px;
      z-index: 10;
      user-select: none;
    }

    button.move {
      width: 60px;
      height: 60px;
      font-size: 18px;
      opacity: 0.75;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #forward { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #back { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <button id="startBtn">Enable Look</button>
  <div id="controls">
    <button id="forward" class="move">↑</button>
    <button id="left" class="move">←</button>
    <button id="back" class="move">↓</button>
    <button id="right" class="move">→</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    /**
     * Paths to textures baked with AutoLightmap.py (export PNG/WebP next to this file or host them).
     * Names follow IMAGE_NAME + group suffix from Blender, e.g. LightmapAtlas_MyGroup.png
     * Use null for aoMapUrl to skip AO.
     */
    const CONFIG = {
      glbUrl:
        "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/Library.glb",
      /** When false, scene lights are off (lightmap / emissive-only look). Toggle to true for dynamic lighting + spec. */
      enableSceneLights: false,
      /** GI-only indirect bake — linear / non-color data */
      lightMapUrl: "./LightmapAtlas.png",
      aoMapUrl: "./LightmapAtlas_AO.png",
      lightMapIntensity: 1.0,
      aoMapIntensity: 1.0,
      /** Lower ambient when lightmap carries bounce GI (hybrid with real-time sun/spec). */
      ambientIntensity: 0.28,
      directionalIntensity: 0.85,
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const cameraHeight = 1.6;
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, cameraHeight, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      stencil: false,
      depth: true,
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.ambientIntensity);
    ambientLight.userData.baseIntensity = CONFIG.ambientIntensity;
    scene.add(ambientLight);
    ambientLight.intensity = 0.05;

    const directionalLight = new THREE.DirectionalLight(0xffffff, CONFIG.directionalIntensity);
    directionalLight.userData.baseIntensity = CONFIG.directionalIntensity;
    const sunDirection = new THREE.Vector3(0.85340573, -0.3994638, 0.3348542).normalize();
    const sunDistance = 50;
    directionalLight.position.copy(sunDirection).multiplyScalar(-sunDistance);
    directionalLight.target.position.set(0, 0, 0);
    scene.add(directionalLight);
    scene.add(directionalLight.target);

    /** Applies CONFIG.enableSceneLights to ambient, directional, and any lights under `root` (e.g. GLB). */
    function applySceneLightsEnabled(enabled, root = null) {
      const applyOne = (light) => {
        if (light.userData.baseIntensity === undefined) {
          light.userData.baseIntensity = light.intensity;
        }
        light.visible = enabled;
        light.intensity = enabled ? light.userData.baseIntensity : 0;
      };

      applyOne(ambientLight);
      applyOne(directionalLight);

      if (root) {
        root.traverse((o) => {
          if (o.isLight) applyOne(o);
        });
      }
    }

    applySceneLightsEnabled(CONFIG.enableSceneLights);

    function loadTexture(url, colorSpace) {
      const loader = new THREE.TextureLoader();
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (tex) => {
            tex.colorSpace = colorSpace;
            tex.flipY = false;
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            resolve(tex);
          },
          undefined,
          reject
        );
      });
    }

    /**
     * Attach baked GI + optional AO without destroying per-mesh PBR differences.
     * Clones each MeshStandardMaterial once per original material reference.
     */
    function applyBakedMaps(root, lightMap, aoMap) {
      const cloneFor = new Map();
      let warnedNoUv2 = false;

      root.traverse((child) => {
        if (!child.isMesh) return;
        const geo = child.geometry;
        if (!geo.attributes.uv2) {
          if (!warnedNoUv2) {
            console.warn(
              "[Lightmap] Missing geometry.attributes.uv2 — export LightmapUV as second UV from Blender."
            );
            warnedNoUv2 = true;
          }
          return;
        }

        const orig = child.material;
        const list = Array.isArray(orig) ? orig : [orig];
        const next = list.map((m) => {
          if (!(m instanceof THREE.MeshStandardMaterial)) return m;
          let nm = cloneFor.get(m);
          if (!nm) {
            nm = m.clone();
            nm.lightMap = lightMap;
            nm.lightMapIntensity = CONFIG.lightMapIntensity;
            if (aoMap) {
              nm.aoMap = aoMap;
              nm.aoMapIntensity = CONFIG.aoMapIntensity;
            }
            nm.needsUpdate = true;
            cloneFor.set(m, nm);
          }
          return nm;
        });
        child.material = Array.isArray(orig) ? next : next[0];
      });
    }

    const gltfLoader = new GLTFLoader();
    const linearSpace = THREE.LinearSRGBColorSpace;

    async function bootstrap() {
      let lightMapTex = null;
      let aoTex = null;

      try {
        lightMapTex = await loadTexture(CONFIG.lightMapUrl, linearSpace);
      } catch (e) {
        console.warn(
          "[Lightmap] Could not load lightMapUrl — place baked PNG next to index or set CONFIG.lightMapUrl:",
          CONFIG.lightMapUrl,
          e
        );
      }

      if (CONFIG.aoMapUrl) {
        try {
          aoTex = await loadTexture(CONFIG.aoMapUrl, linearSpace);
        } catch (e) {
          console.warn("[Lightmap] AO optional — failed to load:", CONFIG.aoMapUrl, e);
        }
      }

      gltfLoader.load(
        CONFIG.glbUrl,
        (gltf) => {
          scene.add(gltf.scene);
          applySceneLightsEnabled(CONFIG.enableSceneLights, gltf.scene);
          if (lightMapTex) {
            applyBakedMaps(gltf.scene, lightMapTex, aoTex);
          }
        },
        undefined,
        (error) => {
          console.error("Failed to load GLB:", error);
        }
      );
    }

    bootstrap();

    const move = { forward: false, back: false, left: false, right: false };
    function bindButton(id, key) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", () => (move[key] = true), { passive: true });
      el.addEventListener("touchend", () => (move[key] = false), { passive: true });
      el.addEventListener("mousedown", () => (move[key] = true));
      el.addEventListener("mouseup", () => (move[key] = false));
      el.addEventListener("mouseleave", () => (move[key] = false));
    }
    bindButton("forward", "forward");
    bindButton("back", "back");
    bindButton("left", "left");
    bindButton("right", "right");

    const speed = 0.08;
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    function updateMovement() {
      camera.getWorldDirection(forwardVec);
      forwardVec.y = 0;
      forwardVec.normalize();
      rightVec.crossVectors(forwardVec, upAxis).normalize();

      const moveVec = new THREE.Vector3();
      if (move.forward) moveVec.add(forwardVec);
      if (move.back) moveVec.addScaledVector(forwardVec, -1);
      if (move.right) moveVec.add(rightVec);
      if (move.left) moveVec.addScaledVector(rightVec, -1);

      if (moveVec.lengthSq() > 0) {
        moveVec.normalize().multiplyScalar(speed);
        camera.position.add(moveVec);
      }
      camera.position.y = cameraHeight;
    }

    let yaw = 0;
    let pitch = 0;
    let smoothYaw = 0;
    let smoothPitch = 0;
    let baseAlpha = null;

    function handleOrientation(e) {
      if (e.alpha === null) return;
      if (baseAlpha === null) baseAlpha = e.alpha;
      yaw = THREE.MathUtils.degToRad(e.alpha - baseAlpha);
      pitch = THREE.MathUtils.degToRad(e.beta - 90);
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
    }

    document.getElementById("startBtn").onclick = async () => {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") return;
      }
      window.addEventListener("deviceorientation", handleOrientation);
      document.getElementById("startBtn").style.display = "none";
    };

    const smoothing = 0.1;
    function updateCameraRotation() {
      smoothYaw += (yaw - smoothYaw) * smoothing;
      smoothPitch += (pitch - smoothPitch) * smoothing;
      camera.rotation.order = "YXZ";
      camera.rotation.y = smoothYaw;
      camera.rotation.x = smoothPitch;
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCameraRotation();
      updateMovement();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
