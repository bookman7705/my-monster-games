<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — GLB + baked GI lightmap</title>
  <link rel="icon" href="data:," />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #202020;
      font-family: Arial, sans-serif;
    }

    #startBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 12px;
      background: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    #fullscreenBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 12px;
      background: white;
      border: none;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 60px 60px 60px;
      gap: 10px;
      z-index: 10;
      user-select: none;
    }

    button.move {
      width: 60px;
      height: 60px;
      font-size: 18px;
      opacity: 0.75;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #forward { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #back { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    #lightmapDebug {
      position: absolute;
      top: 56px;
      left: 20px;
      max-width: min(420px, 92vw);
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.72);
      color: #e8e8e8;
      font: 12px/1.45 Consolas, "Courier New", monospace;
      z-index: 11;
      border-radius: 6px;
      pointer-events: none;
    }

    #lightmapDebug h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    #lightmapDebug .ok {
      color: #7dffb3;
    }

    #lightmapDebug .warn {
      color: #ffd47d;
    }

    #lightmapDebug .err {
      color: #ff7d7d;
    }

    #lightmapDebugPreview {
      display: block;
      margin-top: 8px;
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      background: #111;
      border: 1px solid #444;
      border-radius: 4px;
    }

    #lightmapDebugPreview.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <button id="startBtn">Enable Look</button>
  <button type="button" id="fullscreenBtn" aria-pressed="false">Fullscreen</button>
  <div id="controls">
    <button id="forward" class="move">↑</button>
    <button id="left" class="move">←</button>
    <button id="back" class="move">↓</button>
    <button id="right" class="move">→</button>
  </div>

  <div id="lightmapDebug" aria-live="polite" hidden>
    <h3>Lightmap debug</h3>
    <div id="lightmapDebugBody"></div>
    <canvas id="lightmapDebugPreview" class="hidden" width="128" height="128"></canvas>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

    /**
     * Per-mesh lightmap paths match AutoLightmap.py image_names_for_group():
     *   base = IMAGE_NAME + "_" + groupKey,  AO file = base + "_AO"
     *   groupKey = sanitize(lightmap_group) from mesh.userData, else "__solo_" + sanitize(mesh.name).
     * Place exported PNGs under lightmapTextureBasePath (e.g. LightmapAtlas___solo_Sphere.png).
     */
    const CONFIG = {
      glbUrl:
      //"https://raw.githubusercontent.com/bookman7705/my-monster-games/main/Library.glb",
      "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/examples/BedRoom.glb",
        //"./library.glb",
      /** Global world/model scale (1 = authored size). */
      worldScale: 1,
      /** Same as AutoLightmap.py IMAGE_NAME */
      IMAGE_NAME: "LightmapAtlas",
      /** Prefix URL/folder for baked textures */
      lightmapTextureBasePath: "./",
      /** Tried in order per base name */
      textureExtensions: [".png", ".jpg", ".jpeg", ".webp"],
      /** Toggle baked GI lightmap loading/application. */
      enableLightMaps: true,
      loadAoMaps: true,
      /** When false, scene lights are off (lightmap / emissive-only look). Toggle to true for dynamic lighting + spec. */
      enableSceneLights: true,
      lightMapIntensity: 3.0,
      aoMapIntensity: 0.5,
      /** Ambient + HDRI fill (hybrid with baked lightmap). */
      ambientIntensity: 0.75,
      /** Key light; ignored when suppressRealtimeDiffuseForBakedLightmaps (see below). */
      directionalIntensity: 1.1,
      /**
       * Debug-only second ambient: respects enableSceneLights (see applySceneLightsEnabled).
       * Use ~0.1 to verify lightmap contribution when “real” lights are off. Set to 0 to remove.
       */
      debugAmbientIntensity: 0.0,
      /**
       * Three.js adds lightMap to indirect irradiance only; DirectionalLight + AmbientLight add
       * diffuse without shadowing, which erases dark areas baked into the lightmap. When lightmaps
       * are on, default to a tiny fill ambient and no directional sun unless you add shadow maps.
       */
      suppressRealtimeDiffuseForBakedLightmaps: false,
      /** Used only when enableLightMaps && suppressRealtimeDiffuseForBakedLightmaps */
      bakedFillAmbient: 0.06,
      /** On-screen panel: load status, UV2 stats, lightmap thumbnail. Set false to hide. */
      showLightmapDebugUI: false,
      /** Toggle HDR environment lighting/reflections. */
      useHdr: false,
      /** Equirect .hdr beside this file — PMREM → scene.environment only (IBL / reflections, not sky). */
      environmentHdrUrl: "./aerodynamics_workshop_1k.hdr",
      /** ACES exposure (HDR + sun). */
      toneMappingExposure: 0.92,
      /** Scales HDRI contribution on MeshStandardMaterial (reflections / indirect spec). */
      iblEnvMapIntensity: 1.2,
      /** Camera-mounted flashlight. */
      enableFlashlight: false,
      flashlightIntensity: 50,
      /** Blender Directional Light Euler rotation (degrees). */
      blenderDirectionalEulerDeg: [-28.061, 38.8838, -47.3439],
      /** Blender Euler order used for the values above. */
      blenderEulerOrder: "XYZ",
      /** Blender light forward axis ("-Z" for Sun/Spot/Area, "-Y" for some rigs). */
      blenderLightForwardAxis: "-Z",
    };

    const linearSpace = THREE.LinearSRGBColorSpace;

    /** Mirrors AutoLightmap.py `sanitize_name`. */
    function sanitizeName(name) {
      const s = String(name).trim().replace(/[^A-Za-z0-9_-]+/g, "_");
      return s || "Group";
    }

    /** Mirrors AutoLightmap.py `partition_lightmap_groups` key per mesh. */
    function lightmapGroupKeyForMesh(mesh) {
      const g = mesh.userData?.lightmap_group;
      if (typeof g === "string" && g.trim()) {
        return sanitizeName(g.trim());
      }
      return `__solo_${sanitizeName(mesh.name)}`;
    }

    function lightmapImageBaseForMesh(mesh) {
      return `${CONFIG.IMAGE_NAME}_${lightmapGroupKeyForMesh(mesh)}`;
    }

    /** Unique base names (internal image names / file stems) for all meshes under root. */
    function collectLightmapBasesFromScene(root) {
      const set = new Set();
      root.traverse((o) => {
        if (o.isMesh) set.add(lightmapImageBaseForMesh(o));
      });
      return Array.from(set).sort();
    }

    function candidateUrlsForStem(stem) {
      let folder = String(CONFIG.lightmapTextureBasePath ?? "./").replace(/\\/g, "/");
      folder = folder.replace(/\/+$/, "");
      const prefix = folder.length ? `${folder}/` : "";
      return CONFIG.textureExtensions.map((ext) => `${prefix}${stem}${ext}`);
    }

    /**
     * Some pipelines export numbered names as Cube001, Cube.001, or Cube_001.
     * Try all common variants so GI files still resolve.
     */
    function candidateStemVariants(stem) {
      const set = new Set([stem]);
      const m = String(stem).match(/^(.*?)([A-Za-z]+)(\d{3})$/);
      if (m) {
        const [, prefix, head, digits] = m;
        set.add(`${prefix}${head}.${digits}`);
        set.add(`${prefix}${head}_${digits}`);
        // Fallback for scenes where only a shared non-numbered atlas exists.
        set.add(`${prefix}${head}`);
      }
      return Array.from(set);
    }

    function stemFromUrl(url) {
      return String(url).replace(/^.*\//, "").replace(/\.[^./?#]+(?:[?#].*)?$/, "");
    }

    function formatTextureLoadError(url, err) {
      if (err instanceof Error && err.message) return err.message;
      if (err && typeof err === "object") {
        if (typeof err.message === "string" && err.message) return err.message;
        const img = err.target;
        if (img && typeof img.src === "string") {
          return `Image failed to load: ${img.src}`;
        }
      }
      return `Failed to load: ${url}`;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const S = Math.max(0.0001, Number(CONFIG.worldScale) || 1);
    const cameraHeight = 1.71 * S;
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, cameraHeight, 5 * S);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance",
      stencil: false,
      depth: true,
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = CONFIG.toneMappingExposure;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    function loadHdrEnvironment() {
      if (!CONFIG.useHdr) return Promise.resolve();
      const url = String(CONFIG.environmentHdrUrl || "").trim();
      if (!url) return Promise.resolve();

      return new Promise((resolve) => {
        new RGBELoader().load(
          url,
          (hdrTexture) => {
            hdrTexture.mapping = THREE.EquirectangularReflectionMapping;

            const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;

            scene.environment = envMap;
            scene.background = new THREE.Color(0x202020);

            hdrTexture.dispose();
            pmremGenerator.dispose();
            resolve();
          },
          undefined,
          (err) => {
            console.warn("[HDR] environment load failed:", err);
            resolve();
          }
        );
      });
    }

    /**
     * GLB/glTF import already converts Blender basis to Three.js basis.
     * Treat incoming Euler values as Three-space and convert directly.
     */
    function blenderEulerDegToThreeQuaternion(xDeg, yDeg, zDeg, order = "XYZ") {
      const eulerThree = new THREE.Euler(
        THREE.MathUtils.degToRad(xDeg),
        THREE.MathUtils.degToRad(yDeg),
        THREE.MathUtils.degToRad(zDeg),
        order
      );
      return new THREE.Quaternion().setFromEuler(eulerThree).normalize();
    }

    /**
     * DirectionalLight points along local -Z in Three.js.
     */
    function blenderLightDirectionToThree(eulerDeg, order = "XYZ") {
      const [xDeg, yDeg, zDeg] = eulerDeg;
      const qThree = blenderEulerDegToThreeQuaternion(xDeg, yDeg, zDeg, order);
      return new THREE.Vector3(0, 0, -1).applyQuaternion(qThree).normalize();
    }

    function resolveDiffuseLightLevels() {
      if (CONFIG.enableLightMaps && CONFIG.suppressRealtimeDiffuseForBakedLightmaps) {
        return {
          ambient: Math.max(0, Number(CONFIG.bakedFillAmbient) || 0),
          directional: 0,
          debug: 0,
        };
      }
      return {
        ambient: CONFIG.ambientIntensity,
        directional: CONFIG.directionalIntensity,
        debug: CONFIG.debugAmbientIntensity,
      };
    }

    const L0 = resolveDiffuseLightLevels();
    const ambientLight = new THREE.AmbientLight(0xffffff, L0.ambient);
    ambientLight.userData.baseIntensity = L0.ambient;
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, L0.directional);
    directionalLight.userData.baseIntensity = L0.directional;
    const sunDirection = blenderLightDirectionToThree(
      CONFIG.blenderDirectionalEulerDeg,
      CONFIG.blenderEulerOrder
    );
    const sunDistance = 50 * S;
    directionalLight.position.copy(sunDirection).multiplyScalar(-sunDistance);
    directionalLight.target.position.set(0, 0, 0);
    scene.add(directionalLight);
    scene.add(directionalLight.target);

    const flashlight = new THREE.SpotLight(
      0xffffff,
      CONFIG.flashlightIntensity,
      35 * S,
      Math.PI / 9,
      0.35,
      1.2
    );
    flashlight.visible = !!CONFIG.enableFlashlight;
    flashlight.position.set(0, 0, 0);
    camera.add(flashlight);
    const flashlightTarget = new THREE.Object3D();
    scene.add(flashlightTarget);
    flashlight.target = flashlightTarget;

    const debugAmbientLight = new THREE.AmbientLight(0xffffff, L0.debug);
    debugAmbientLight.userData.baseIntensity = L0.debug;
    debugAmbientLight.name = "DebugAmbientFill";
    scene.add(debugAmbientLight);

    /** Applies CONFIG.enableSceneLights to ambient, directional, debug fill, and any lights under `root` (e.g. GLB). */
    function applySceneLightsEnabled(enabled, root = null) {
      const applyOne = (light) => {
        if (light.userData.baseIntensity === undefined) {
          light.userData.baseIntensity = light.intensity;
        }
        light.visible = enabled;
        light.intensity = enabled ? light.userData.baseIntensity : 0;
      };

      applyOne(ambientLight);
      applyOne(directionalLight);
      applyOne(debugAmbientLight);

      if (root) {
        root.traverse((o) => {
          if (o.isLight) applyOne(o);
        });
      }
    }

    applySceneLightsEnabled(CONFIG.enableSceneLights);

    const lightmapDebugEl = document.getElementById("lightmapDebug");
    const lightmapDebugBodyEl = document.getElementById("lightmapDebugBody");
    const lightmapDebugPreviewEl = document.getElementById("lightmapDebugPreview");

    function setLightmapDebugVisible(show) {
      if (!CONFIG.showLightmapDebugUI) {
        lightmapDebugEl.hidden = true;
        return;
      }
      lightmapDebugEl.hidden = !show;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function drawLightmapPreview(tex) {
      if (!tex || !tex.image || !lightmapDebugPreviewEl) return;
      const img = tex.image;
      if (!img.width) return;
      lightmapDebugPreviewEl.classList.remove("hidden");
      const ctx = lightmapDebugPreviewEl.getContext("2d");
      ctx.clearRect(0, 0, lightmapDebugPreviewEl.width, lightmapDebugPreviewEl.height);
      ctx.drawImage(img, 0, 0, lightmapDebugPreviewEl.width, lightmapDebugPreviewEl.height);
    }

    /**
     * @param {{ diagnostics: object[], anyDiffuseLoaded: boolean, apply: object|null }} state
     */
    function renderLightmapDebugPanel(state) {
      if (!CONFIG.showLightmapDebugUI) {
        lightmapDebugEl.hidden = true;
        return;
      }

      const atlasRows = (state.diagnostics || [])
        .map((r) => {
          const d = r.diffuseOk
            ? `<span class="ok">GI OK</span> ${esc(r.diffuseUrl)}`
            : `<span class="err">GI missing</span> <span class="warn">${esc(r.diffuseErr || "")}</span>`;
          const a = !CONFIG.loadAoMaps
            ? `<span class="warn">AO disabled (CONFIG.loadAoMaps)</span>`
            : r.aoOk
              ? `<span class="ok">AO OK</span> ${esc(r.aoUrl)}`
              : `<span class="warn">AO not loaded</span> ${esc(r.aoErr || "")}`;
          return `<strong>${esc(r.baseName)}</strong><br/>${d}<br/>${a}<br/><br/>`;
        })
        .join("");

      let applyBlock = "";
      if (state.apply) {
        const a = state.apply;
        const uvWarn =
          a.meshSkippedNoUv2 > 0
            ? `<span class="warn"> ${a.meshSkippedNoUv2} mesh(es) missing uv2 — lightmap cannot apply</span>`
            : `<span class="ok"> uv2 present on sampled meshes</span>`;
        const atlasWarn =
          (a.meshSkippedNoAtlas || 0) > 0
            ? `<br/><span class="warn">Meshes with no matching GI file: ${a.meshSkippedNoAtlas}</span>`
            : "";
        const working =
          state.anyDiffuseLoaded &&
          a.meshWithLightMap > 0 &&
          a.meshSkippedNoUv2 === 0 &&
          (a.meshSkippedNoAtlas || 0) === 0;
        const statusLine = working
          ? `<span class="ok">Lightmap pipeline: OK (applied to materials)</span>`
          : state.anyDiffuseLoaded && a.meshSkippedNoUv2 > 0
            ? `<span class="warn">GI files found but some meshes lack uv2</span>`
            : state.anyDiffuseLoaded && a.meshWithLightMap === 0
              ? `<span class="warn">No MeshStandardMaterial meshes updated — check materials</span>`
              : !state.anyDiffuseLoaded
                ? `<span class="err">No GI textures loaded — check names under lightmapTextureBasePath</span>`
                : `<span class="warn">Check stats below</span>`;

        applyBlock = `
<br/><br/><strong>Scene / GLB</strong><br/>
${statusLine}<br/>
Meshes (total): ${a.meshTotal}<br/>
Meshes with <code>uv2</code>: ${a.meshWithUv2}<br/>
Meshes skipped (no uv2): ${a.meshSkippedNoUv2}${uvWarn}<br/>
Meshes skipped (no GI file for derived base): ${a.meshSkippedNoAtlas || 0}${atlasWarn}<br/>
Meshes using MeshStandardMaterial + lightMap: ${a.meshWithLightMap}<br/>
Unique material clones with lightMap: ${a.materialsWithLightMap}<br/>
Non-standard materials skipped: ${a.meshSkippedNonStd}
`;
      }

      lightmapDebugBodyEl.innerHTML = `
<strong>Atlases (from mesh names / userData.lightmap_group)</strong><br/>
${atlasRows || "<span class=\"warn\">No meshes in GLB</span>"}
${applyBlock}
`;
      setLightmapDebugVisible(true);
    }

    function loadTexture(url, colorSpace) {
      const loader = new THREE.TextureLoader();
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (tex) => {
            tex.colorSpace = colorSpace;
            tex.flipY = false;
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            resolve(tex);
          },
          undefined,
          (err) => reject(new Error(formatTextureLoadError(url, err)))
        );
      });
    }

    /** First URL that loads; throws if none. */
    async function loadTextureFirstMatch(urls, colorSpace) {
      let lastErr = null;
      for (const url of urls) {
        try {
          const tex = await loadTexture(url, colorSpace);
          return { tex, url };
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("No texture candidates matched");
    }

    /**
     * GLTFLoader maps glTF TEXCOORD_0..3 to geometry attributes `uv`, `uv1`, `uv2`, `uv3`.
     * Blender's second UV (e.g. LightmapUV) becomes TEXCOORD_1 → `uv1`.
     * MeshStandardMaterial.lightMap / aoMap always sample attribute `uv2`, so two-UV GLBs
     * need this alias or lightmaps never bind.
     */
    function ensureLightmapUv2FromGltfSecondTexcoord(geometry) {
      if (!geometry?.attributes) return;
      if (geometry.attributes.uv2) return;
      const uv1 = geometry.attributes.uv1;
      if (uv1) {
        geometry.setAttribute("uv2", uv1);
      }
    }

    function traverseMeshesEnsureLightmapUv2(root) {
      root.traverse((o) => {
        if (o.isMesh && o.geometry) ensureLightmapUv2FromGltfSecondTexcoord(o.geometry);
      });
    }

    /**
     * @returns {Promise<{ pack: Map<string, object>, diagnostics: object[] }>}
     */
    async function loadLightmapPackForBases(bases) {
      const pack = new Map();
      const diagnostics = [];
      for (const baseName of bases) {
        const diffUrls = candidateStemVariants(baseName).flatMap((s) => candidateUrlsForStem(s));
        let diffuseOk = false;
        let diffuseUrl = "";
        let diffuseErr = "";
        let resolvedBaseStem = baseName;
        let lightMap = null;
        let aoOk = false;
        let aoUrl = "";
        let aoErr = "";
        let aoMap = null;
        try {
          const r = await loadTextureFirstMatch(diffUrls, linearSpace);
          lightMap = r.tex;
          diffuseUrl = r.url;
          resolvedBaseStem = stemFromUrl(r.url);
          diffuseOk = true;
        } catch (e) {
          diffuseErr = e instanceof Error ? e.message : String(e);
        }
        if (CONFIG.loadAoMaps && diffuseOk) {
          const aoStem = `${resolvedBaseStem}_AO`;
          const aoUrls = candidateStemVariants(aoStem).flatMap((s) => candidateUrlsForStem(s));
          try {
            const r = await loadTextureFirstMatch(aoUrls, linearSpace);
            aoMap = r.tex;
            aoUrl = r.url;
            aoOk = true;
          } catch (e) {
            aoErr = e instanceof Error ? e.message : "optional AO missing";
          }
        } else if (!CONFIG.loadAoMaps) {
          aoErr = "disabled";
        } else {
          aoErr = "skipped (no GI texture)";
        }
        if (diffuseOk) {
          pack.set(baseName, { lightMap, aoMap, diffuseUrl, aoUrl });
        }
        diagnostics.push({
          baseName,
          diffuseOk,
          diffuseUrl,
          diffuseErr,
          aoOk,
          aoUrl,
          aoErr,
          triedDiffuse: diffUrls,
        });
      }
      return { pack, diagnostics };
    }

    /**
     * Per-mesh GI/AO from `pack` (key = lightmapImageBaseForMesh). Same material on two atlases
     * gets two clones (key includes material.uuid + baseName).
     * @returns {{
     *   meshTotal: number,
     *   meshWithUv2: number,
     *   meshSkippedNoUv2: number,
     *   meshSkippedNonStd: number,
     *   meshWithLightMap: number,
     *   meshSkippedNoAtlas: number,
     *   materialsWithLightMap: number,
     * }}
     */
    function applyBakedMapsFromPack(root, pack) {
      const cloneFor = new Map();
      let warnedNoUv2 = false;

      const stats = {
        meshTotal: 0,
        meshWithUv2: 0,
        meshSkippedNoUv2: 0,
        meshSkippedNonStd: 0,
        meshWithLightMap: 0,
        meshSkippedNoAtlas: 0,
        materialsWithLightMap: 0,
      };

      root.traverse((child) => {
        if (!child.isMesh) return;
        stats.meshTotal += 1;

        const geo = child.geometry;
        if (!geo.attributes.uv2) {
          stats.meshSkippedNoUv2 += 1;
          if (!warnedNoUv2) {
            console.warn(
              "[Lightmap] Missing geometry.attributes.uv2 (and uv1) — add a second UV in Blender and re-export glTF, or check Draco/custom stripping of TEXCOORD_1."
            );
            warnedNoUv2 = true;
          }
          return;
        }

        stats.meshWithUv2 += 1;

        const baseName = lightmapImageBaseForMesh(child);
        const entry = pack.get(baseName);
        if (!entry || !entry.lightMap) {
          stats.meshSkippedNoAtlas += 1;
          return;
        }
        const lightMap = entry.lightMap;
        const aoMap = entry.aoMap || null;

        const orig = child.material;
        const list = Array.isArray(orig) ? orig : [orig];
        let appliedThisMesh = false;
        const next = list.map((m) => {
          if (!(m instanceof THREE.MeshStandardMaterial)) {
            return m;
          }
          const mapKey = `${m.uuid}:${baseName}`;
          let nm = cloneFor.get(mapKey);
          if (!nm) {
            nm = m.clone();
            nm.lightMap = lightMap;
            nm.lightMapIntensity = CONFIG.lightMapIntensity;
            nm.envMapIntensity = CONFIG.iblEnvMapIntensity;
            if (aoMap) {
              nm.aoMap = aoMap;
              nm.aoMapIntensity = CONFIG.aoMapIntensity;
            }
            nm.needsUpdate = true;
            cloneFor.set(mapKey, nm);
            stats.materialsWithLightMap += 1;
          }
          appliedThisMesh = true;
          return nm;
        });

        if (!appliedThisMesh) {
          stats.meshSkippedNonStd += 1;
        } else {
          stats.meshWithLightMap += 1;
        }

        child.material = Array.isArray(orig) ? next : next[0];
      });

      return stats;
    }

    function countMeshUvStats(root) {
      const stats = {
        meshTotal: 0,
        meshWithUv2: 0,
        meshSkippedNoUv2: 0,
        meshSkippedNonStd: 0,
        meshWithLightMap: 0,
        meshSkippedNoAtlas: 0,
        materialsWithLightMap: 0,
      };
      root.traverse((child) => {
        if (!child.isMesh) return;
        stats.meshTotal += 1;
        if (!child.geometry.attributes.uv2) stats.meshSkippedNoUv2 += 1;
        else stats.meshWithUv2 += 1;
      });
      return stats;
    }

    const gltfLoader = new GLTFLoader();
    function bootstrap() {
      gltfLoader.load(
        CONFIG.glbUrl,
        async (gltf) => {
          try {
            scene.add(gltf.scene);
            gltf.scene.scale.setScalar(S);
            applySceneLightsEnabled(CONFIG.enableSceneLights, gltf.scene);
            if (CONFIG.enableLightMaps && CONFIG.suppressRealtimeDiffuseForBakedLightmaps) {
              gltf.scene.traverse((o) => {
                if (!o.isLight) return;
                if (o.userData.baseIntensity === undefined) {
                  o.userData.baseIntensity = o.intensity;
                }
                o.intensity = 0;
                o.visible = false;
              });
            }
            traverseMeshesEnsureLightmapUv2(gltf.scene);

            const bases = collectLightmapBasesFromScene(gltf.scene);
            const { pack, diagnostics } = CONFIG.enableLightMaps
              ? await loadLightmapPackForBases(bases)
              : { pack: new Map(), diagnostics: [] };
            const anyDiffuseLoaded = CONFIG.enableLightMaps && pack.size > 0;

            if (anyDiffuseLoaded) {
              const first = pack.values().next().value;
              if (first?.lightMap) drawLightmapPreview(first.lightMap);
            }

            const apply = anyDiffuseLoaded
              ? applyBakedMapsFromPack(gltf.scene, pack)
              : countMeshUvStats(gltf.scene);

            console.info("[Lightmap] atlas bases", bases, "loaded", pack.size, "apply", apply);

            renderLightmapDebugPanel({
              diagnostics,
              anyDiffuseLoaded,
              apply,
            });

            gltf.scene.traverse((o) => {
              if (!o.isMesh) return;
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              for (const m of mats) {
                if (m instanceof THREE.MeshStandardMaterial) {
                  m.envMapIntensity = CONFIG.iblEnvMapIntensity;
                  m.needsUpdate = true;
                }
              }
            });
          } catch (err) {
            console.error("[Lightmap] After GLB load:", err);
          }
        },
        undefined,
        (error) => {
          console.error("Failed to load GLB:", error);
        }
      );
    }

    loadHdrEnvironment().then(() => bootstrap());

    const clock = new THREE.Clock();

    const move = { forward: false, back: false, left: false, right: false };
    function bindButton(id, key) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", () => (move[key] = true), { passive: true });
      el.addEventListener("touchend", () => (move[key] = false), { passive: true });
      el.addEventListener("mousedown", () => (move[key] = true));
      el.addEventListener("mouseup", () => (move[key] = false));
      el.addEventListener("mouseleave", () => (move[key] = false));
    }
    bindButton("forward", "forward");
    bindButton("back", "back");
    bindButton("left", "left");
    bindButton("right", "right");

    /** Walking speed in world units per second (scales with worldScale so pace matches scene size). */
    const walkSpeed = 2.7 * S;
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);
    const cameraLookDir = new THREE.Vector3();

    function updateMovement(delta) {
      camera.getWorldDirection(forwardVec);
      forwardVec.y = 0;
      forwardVec.normalize();
      rightVec.crossVectors(forwardVec, upAxis).normalize();

      const moveVec = new THREE.Vector3();
      if (move.forward) moveVec.add(forwardVec);
      if (move.back) moveVec.addScaledVector(forwardVec, -1);
      if (move.right) moveVec.add(rightVec);
      if (move.left) moveVec.addScaledVector(rightVec, -1);

      if (moveVec.lengthSq() > 0) {
        moveVec.normalize().multiplyScalar(walkSpeed * delta);
        camera.position.add(moveVec);
      }
      camera.position.y = cameraHeight;
    }

    const deviceEuler = new THREE.Euler();
    const deviceQuatTarget = new THREE.Quaternion();
    const deviceQuatSmooth = new THREE.Quaternion();
    const screenAdjustQuat = new THREE.Quaternion();
    const screenAxisZ = new THREE.Vector3(0, 0, 1);
    // Align device camera frame to world frame (same approach as DeviceOrientationControls).
    const deviceToCameraQuat = new THREE.Quaternion(
      -Math.sqrt(0.5),
      0,
      0,
      Math.sqrt(0.5)
    );
    let hasDeviceOrientation = false;

    function handleOrientation(e) {
      if (e.alpha == null || e.beta == null || e.gamma == null) return;

      const alpha = THREE.MathUtils.degToRad(e.alpha);
      const beta = THREE.MathUtils.degToRad(e.beta);
      const gamma = THREE.MathUtils.degToRad(e.gamma);
      const screenAngleDeg =
        window.screen?.orientation?.angle ?? window.orientation ?? 0;
      const screenAngle = THREE.MathUtils.degToRad(screenAngleDeg);

      // Intrinsic Z-X'-Y'' device angles mapped to world quaternion.
      deviceEuler.set(beta, alpha, -gamma, "YXZ");
      deviceQuatTarget.setFromEuler(deviceEuler);
      deviceQuatTarget.multiply(deviceToCameraQuat);

      // Compensate for current screen orientation so tilt remains stable in portrait/landscape.
      screenAdjustQuat.setFromAxisAngle(screenAxisZ, -screenAngle);
      deviceQuatTarget.multiply(screenAdjustQuat);

      if (!hasDeviceOrientation) {
        deviceQuatSmooth.copy(deviceQuatTarget);
        hasDeviceOrientation = true;
      }
    }

    document.getElementById("startBtn").onclick = async () => {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") return;
      }
      window.addEventListener("deviceorientation", handleOrientation);
      document.getElementById("startBtn").style.display = "none";
    };

    const fullscreenBtn = document.getElementById("fullscreenBtn");

    function getFullscreenElement() {
      return (
        document.fullscreenElement ??
        document.webkitFullscreenElement ??
        document.mozFullScreenElement ??
        document.msFullscreenElement ??
        null
      );
    }

    function syncFullscreenButton() {
      const active = !!getFullscreenElement();
      fullscreenBtn.textContent = active ? "Exit fullscreen" : "Fullscreen";
      fullscreenBtn.setAttribute("aria-pressed", active ? "true" : "false");
    }

    function requestFullscreenForPage() {
      const el = document.documentElement;
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
      if (el.msRequestFullscreen) return el.msRequestFullscreen();
      return Promise.reject(new Error("Fullscreen not supported"));
    }

    function exitFullscreenPage() {
      const exit =
        document.exitFullscreen ??
        document.webkitExitFullscreen ??
        document.mozCancelFullScreen ??
        document.msExitFullscreen;
      if (!exit) return Promise.reject(new Error("Exit fullscreen not supported"));
      return exit.call(document);
    }

    fullscreenBtn.addEventListener("click", () => {
      if (getFullscreenElement()) {
        exitFullscreenPage().catch(() => {});
      } else {
        requestFullscreenForPage().catch(() => {});
      }
    });

    document.addEventListener("fullscreenchange", syncFullscreenButton);
    document.addEventListener("webkitfullscreenchange", syncFullscreenButton);
    document.addEventListener("mozfullscreenchange", syncFullscreenButton);
    document.addEventListener("MSFullscreenChange", syncFullscreenButton);

    const rotationSmoothing = 0.12;
    function updateCameraRotation() {
      if (!hasDeviceOrientation) return;
      deviceQuatSmooth.slerp(deviceQuatTarget, rotationSmoothing);
      camera.quaternion.copy(deviceQuatSmooth);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      updateCameraRotation();
      updateMovement(dt);
      if (CONFIG.enableFlashlight) {
        camera.getWorldDirection(cameraLookDir);
        flashlightTarget.position.copy(camera.position).add(cameraLookDir.multiplyScalar(12 * S));
        flashlightTarget.updateMatrixWorld();
      }
      renderer.render(scene, camera);
    }
    animate();

    function refreshRendererSize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", refreshRendererSize);
    document.addEventListener("fullscreenchange", refreshRendererSize);
    document.addEventListener("webkitfullscreenchange", refreshRendererSize);
    document.addEventListener("mozfullscreenchange", refreshRendererSize);
    document.addEventListener("MSFullscreenChange", refreshRendererSize);
  </script>
</body>
</html>
