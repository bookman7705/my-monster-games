<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library — GLB + baked GI lightmap</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #202020;
      font-family: Arial, sans-serif;
    }

    #startBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 12px;
      background: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>
<button id="startBtn">Enable Look</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
  glbUrl: "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/Library.glb",

  // baked textures
  lightMapUrl: "./LightmapAtlas.png",
  aoMapUrl: "./LightmapAtlas_AO.png",

  lightMapIntensity: 1.0,
  aoMapIntensity: 1.0,

  // lighting modes
  enableSceneLights: false,

  // IMPORTANT: Unreal equivalent lighting (optional HDRI)
  enableEnvironment: true,
  envMapUrl: "./env.hdr",

  ambientIntensity: 0.15,
  directionalIntensity: 0.85
};

/* =========================================================
   SCENE SETUP
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  1000
);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTS (REALTIME)
========================================================= */
const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.ambientIntensity);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, CONFIG.directionalIntensity);
directionalLight.position.set(5, 10, 5);
scene.add(directionalLight);

/* =========================================================
   ENVIRONMENT LIGHT (IMPORTANT MISSING PIECE)
========================================================= */
async function loadEnvMap() {
  if (!CONFIG.enableEnvironment) return;

  const loader = new THREE.RGBELoader();
  const tex = await new Promise((resolve, reject) => {
    loader.load(CONFIG.envMapUrl, resolve, undefined, reject);
  });

  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = tex;
}

/* =========================================================
   TEXTURE LOADING
========================================================= */
function loadTexture(url) {
  return new Promise((resolve, reject) => {
    new THREE.TextureLoader().load(url, resolve, undefined, reject);
  });
}

/* =========================================================
   LIGHTMAP APPLY
========================================================= */
function applyBakedMaps(root, lightMap, aoMap) {

  const cache = new Map();

  root.traverse((obj) => {
    if (!obj.isMesh) return;

    const mat = obj.material;
    const list = Array.isArray(mat) ? mat : [mat];

    const newList = list.map((m) => {

      if (!(m instanceof THREE.MeshStandardMaterial)) return m;

      let cloned = cache.get(m);
      if (!cloned) {
        cloned = m.clone();

        // 🔥 baked GI
        cloned.lightMap = lightMap;
        cloned.lightMapIntensity = CONFIG.lightMapIntensity;

        // optional AO
        if (aoMap) {
          cloned.aoMap = aoMap;
          cloned.aoMapIntensity = CONFIG.aoMapIntensity;
        }

        cloned.needsUpdate = true;
        cache.set(m, cloned);
      }

      return cloned;
    });

    obj.material = Array.isArray(mat) ? newList : newList[0];
  });
}

/* =========================================================
   LIGHT CONTROL
========================================================= */
function setLights(enabled) {
  ambientLight.intensity = enabled ? CONFIG.ambientIntensity : 0;
  directionalLight.intensity = enabled ? CONFIG.directionalIntensity : 0;
}

/* =========================================================
   LOAD PIPELINE
========================================================= */
const gltfLoader = new GLTFLoader();

async function start() {

  // optional HDR environment (Unreal-style skylight replacement)
  try {
    await loadEnvMap();
  } catch (e) {
    console.warn("No env map loaded (optional).");
  }

  let lightMap = null;
  let aoMap = null;

  try {
    lightMap = await loadTexture(CONFIG.lightMapUrl);
  } catch {}

  try {
    aoMap = await loadTexture(CONFIG.aoMapUrl);
  } catch {}

  gltfLoader.load(CONFIG.glbUrl, (gltf) => {

    scene.add(gltf.scene);

    setLights(CONFIG.enableSceneLights);

    if (lightMap) {
      applyBakedMaps(gltf.scene, lightMap, aoMap);
    }

  });
}

start();

/* =========================================================
   DEBUG TOGGLE (important for testing)
========================================================= */
window.testBakeOnly = () => {
  setLights(false);
  console.log("Bake-only mode (Unreal lightmap test)");
};

window.testHybrid = () => {
  setLights(true);
  console.log("Hybrid mode (baked + realtime)");
};

window.testUnrealStyle = () => {
  setLights(false);
  scene.environmentIntensity = 1.0;
  console.log("Unreal-style (GI + HDR only)");
};

/* =========================================================
   RESIZE
========================================================= */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
