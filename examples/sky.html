<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sky + Clouds + Terrain</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "low-power" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

// ---------- Scene ----------
const scene = new THREE.Scene();

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);
camera.position.set(0, 8, 18);

// ---------- SKY GRADIENT ----------
const skyGeo = new THREE.SphereGeometry(200, 16, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x4aa3ff) },
    bottomColor: { value: new THREE.Color(0xdfefff) }
  },
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 topColor;
    uniform vec3 bottomColor;

    void main() {
      float h = normalize(vPos).y * 0.5 + 0.5;
      gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ---------- TERRAIN (cheap heightfield) ----------
const size = 120;
const segments = 128;

const terrainGeo = new THREE.PlaneGeometry(size, size, segments, segments);
terrainGeo.rotateX(-Math.PI / 2);

// simple pseudo noise
function noise(x, y) {
  return (
    Math.sin(x * 0.1) * Math.cos(y * 0.1) +
    Math.sin(x * 0.05 + 10) * 0.5
  );
}

const pos = terrainGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const y = noise(x, z) * 1.5;
  pos.setY(i, y);
}
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshLambertMaterial({
  color: 0x3c7c3c
});

const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.position.y = -2;
scene.add(terrain);

// ---------- LIGHT ----------
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 5);
scene.add(sun);

const ambient = new THREE.AmbientLight(0x88aaff, 0.4);
scene.add(ambient);

// ----------  LAYER (fake volumetric sprites) ----------
const Tex = new THREE.TextureLoader().load(
  "/cloud.png"
);

const cloudGroup = new THREE.Group();
scene.add(cloudGroup);

function createCloud(x, y, z, scale) {
  const mat = new THREE.SpriteMaterial({
    map: cloudTex,
    transparent: true,
    depthWrite: false,
    opacity: 0.6
  });

  const sprite = new THREE.Sprite(mat);
  sprite.position.set(x, y, z);
  sprite.scale.set(scale, scale * 0.6, 1);
  cloudGroup.add(sprite);
}

// scatter clouds
for (let i = 0; i < 25; i++) {
  createCloud(
    (Math.random() - 0.5) * 80,
    10 + Math.random() * 8,
    (Math.random() - 0.5) * 80,
    8 + Math.random() * 10
  );
}

// ---------- CLOUD SHADOW MAP (cheap trick) ----------
const shadowPlaneGeo = new THREE.PlaneGeometry(size, size);
shadowPlaneGeo.rotateX(-Math.PI / 2);

const shadowMat = new THREE.ShadowMaterial({
  opacity: 0.25
});

const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowMat);
shadowPlane.position.y = -1.95;
scene.add(shadowPlane);

// fake moving shadow by shifting light slightly
let t = 0;

// ---------- ANIMATION ----------
function animate() {
  requestAnimationFrame(animate);

  t += 0.002;

  // move clouds slowly
  cloudGroup.position.x = Math.sin(t) * 5;
  cloudGroup.position.z = Math.cos(t) * 5;

  // sun drift (creates shadow movement illusion)
  sun.position.x = 10 + Math.sin(t * 0.5) * 10;
  sun.position.z = 5 + Math.cos(t * 0.5) * 10;

  renderer.render(scene, camera);
}

animate();

// ---------- resize ----------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
