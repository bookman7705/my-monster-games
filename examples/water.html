<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Three.js Mobile Movement</title>
<style>
  body { margin: 0; overflow: hidden; }

  /* Mobile controls */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-gap: 10px;
    justify-items: center;
    align-items: center;
  }

  button {
    width: 60px;
    height: 60px;
    font-size: 18px;
    opacity: 0.7;
  }

  #forward { grid-column: 2; }
  #left    { grid-column: 1; grid-row: 2; }
  #back    { grid-column: 2; grid-row: 2; }
  #right   { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<div id="controls">
  <button id="forward">↑</button>
  <button id="left">←</button>
  <button id="back">↓</button>
  <button id="right">→</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

// Camera
const cameraHeight = 1.6;
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, cameraHeight, 5);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 7);
scene.add(light);

scene.add(new THREE.AmbientLight(0x404040));

// Checkerboard
function createCheckerTexture(size = 512, squares = 8) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const squareSize = size / squares;

  for (let y = 0; y < squares; y++) {
    for (let x = 0; x < squares; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#fff' : '#444';
      ctx.fillRect(x * squareSize, y * squareSize, squareSize, squareSize);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(20, 20);
  return texture;
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({
    map: createCheckerTexture(),
    side: THREE.DoubleSide
  })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Cube (NO ROTATION)
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  [
    new THREE.MeshStandardMaterial({ color: 0xff0000 }),
    new THREE.MeshStandardMaterial({ color: 0x00ff00 }),
    new THREE.MeshStandardMaterial({ color: 0x0000ff }),
    new THREE.MeshStandardMaterial({ color: 0xffff00 }),
    new THREE.MeshStandardMaterial({ color: 0xff00ff }),
    new THREE.MeshStandardMaterial({ color: 0x00ffff })
  ]
);
cube.position.y = 0.5;
scene.add(cube);

// Movement state
const move = {
  forward: false,
  back: false,
  left: false,
  right: false
};

// Button handlers
function bindButton(id, key) {
  const el = document.getElementById(id);

  el.addEventListener('touchstart', () => move[key] = true);
  el.addEventListener('touchend', () => move[key] = false);

  el.addEventListener('mousedown', () => move[key] = true);
  el.addEventListener('mouseup', () => move[key] = false);
  el.addEventListener('mouseleave', () => move[key] = false);
}

bindButton('forward', 'forward');
bindButton('back', 'back');
bindButton('left', 'left');
bindButton('right', 'right');

// Movement config
const speed = 0.08;

// Temp vectors
const forwardVec = new THREE.Vector3();
const rightVec = new THREE.Vector3();

function updateMovement() {
  // Get camera forward direction
  camera.getWorldDirection(forwardVec);

  // Flatten (ground movement only)
  forwardVec.y = 0;
  forwardVec.normalize();

  // Right vector
  rightVec.crossVectors(forwardVec, new THREE.Vector3(0, 1, 0)).normalize();

  if (move.forward) camera.position.addScaledVector(forwardVec, speed);
  if (move.back)    camera.position.addScaledVector(forwardVec, -speed);
  if (move.right)   camera.position.addScaledVector(rightVec, speed);
  if (move.left)    camera.position.addScaledVector(rightVec, -speed);

  // Keep camera grounded
  camera.position.y = cameraHeight;
}

// Animate
function animate() {
  requestAnimationFrame(animate);

  updateMovement();

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
