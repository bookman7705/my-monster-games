// Markerless AR - Android only
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AR Monster - Android</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
  }
}
</script>
</head>

<body>

<script>
async function loadThreeAR() {

  const THREE = await import('three');
  const { GLTFLoader } = await import('https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js');
  const { ARButton } = await import('https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/ARButton.js');

  let scene = new THREE.Scene();
  let camera = new THREE.PerspectiveCamera();
  let renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  /* ---------- LIGHT ---------- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5,10,2);
  scene.add(dirLight);

  /* ---------- MODEL ---------- */
  let model = null;
  const loader = new GLTFLoader();

  loader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb',
    (gltf) => {
      model = gltf.scene;
      model.scale.set(0.1,0.1,0.1);
      model.visible = false;
      scene.add(model);
    }
  );

  /* ---------- RETICLE ---------- */
  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.25, 0.3, 32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0x00ff88 })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  /* ---------- STATE ---------- */
  let placed = false;
  let hitTestSource = null;
  let hitTestSourceRequested = false;

  /* ---------- AR BUTTON ---------- */
  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test']
  }));

  /* ---------- PLACE ON TAP ---------- */
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', () => {
    if (!placed && reticle.visible && model) {
      model.visible = true;
      model.position.setFromMatrixPosition(reticle.matrix);
      model.quaternion.setFromRotationMatrix(reticle.matrix);

      placed = true;
      reticle.visible = false; // ✅ remove targeting circle
    }
  });
  scene.add(controller);

  /* =====================================================
     GESTURES
  ===================================================== */
  let isDragging = false;
  let lastTouch = null;
  let initialDistance = 0;
  let initialScale = 1;

  renderer.domElement.addEventListener('touchstart', (e) => {
    if (!placed || !model) return;

    if (e.touches.length === 1) {
      isDragging = true;
      lastTouch = e.touches[0];
    }

    if (e.touches.length === 2) {
      isDragging = false;

      const dx = e.touches[0].pageX - e.touches[1].pageX;
      const dy = e.touches[0].pageY - e.touches[1].pageY;
      initialDistance = Math.sqrt(dx*dx + dy*dy);
      initialScale = model.scale.x;
    }
  });

  renderer.domElement.addEventListener('touchmove', (e) => {
    if (!placed || !model) return;

    /* ---- DRAG (move on plane) ---- */
    if (e.touches.length === 1 && isDragging) {
      // we update position using hit test in render loop
      lastTouch = e.touches[0];
    }

    /* ---- PINCH SCALE + ROTATE ---- */
    if (e.touches.length === 2) {

      const dx = e.touches[0].pageX - e.touches[1].pageX;
      const dy = e.touches[0].pageY - e.touches[1].pageY;
      const dist = Math.sqrt(dx*dx + dy*dy);

      // SCALE
      let scale = initialScale * (dist / initialDistance);
      scale = Math.max(0.05, Math.min(2, scale));
      model.scale.set(scale, scale, scale);

      // ROTATE
      const angle = Math.atan2(dy, dx);
      model.rotation.y = -angle;
    }
  });

  renderer.domElement.addEventListener('touchend', () => {
    isDragging = false;
  });

  /* ---------- RENDER LOOP ---------- */
  renderer.setAnimationLoop((timestamp, frame) => {

    if (frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((viewerSpace) => {
          session.requestHitTestSource({ space: viewerSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      if (hitTestSource) {
        const hits = frame.getHitTestResults(hitTestSource);

        if (hits.length > 0) {
          const pose = hits[0].getPose(refSpace);

          if (!placed) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          }

          // ✅ DRAGGING updates position using plane
          if (placed && isDragging && model) {
            model.position.setFromMatrixPosition(
              new THREE.Matrix4().fromArray(pose.transform.matrix)
            );
          }
        }
      }
    }

    renderer.render(scene, camera);
  });

}

loadThreeAR();
</script>

</body>
</html>
