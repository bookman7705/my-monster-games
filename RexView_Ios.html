<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rex AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

  
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<style>
body{
margin:0;
background:#111;
height:100vh;
}

model-viewer{
width:100%;
height:100%;
}
</style>
</head>

<body>

<model-viewer

</model-viewer>
