<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rex AR</title>

  <!-- model-viewer library -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin:0;
      background:#111;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    model-viewer {
      width:100%;
      height:100%;
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<body>

<model-viewer
  src="https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.usdz"
  ios-src="https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.usdz"
  ar
  ar-modes="quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
>
</model-viewer>

</body>
</html>
