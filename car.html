<html lang="en">
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      /* Style for the version text overlay */
      .version-overlay {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 20px;
        color: red;
        font-family: Arial, sans-serif;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <!-- Version overlay text -->
    <div class="version-overlay">Version 3.0</div>
  
    <div class="arjs-loader" id="loader">
      <div>Loading, please wait...</div>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker
        type="pattern"
        url="https://raw.githubusercontent.com/bookman7705/my-monster-games/refs/heads/main/hiro.patt"
      >
        <!-- Ambient Light -->
        <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
        
        <!-- Directional Light -->
        <a-light type="directional" intensity="1.5" color="#ffffff" position="0 0 0"></a-light>

        <!-- Glowing Sphere with Point Light -->
        <a-entity
          position="0 2 0"
        >
          
          
          <!-- Point Light -->
          <a-light
            type="point"
            intensity="1.0"
            distance="5"
            decay="2"
            color="#ffffff"
            position="0 2 0"
            castShadow="true"
          ></a-light>
        </a-entity>

        <!-- Car -->
        <a-entity
          gltf-model="https://raw.githubusercontent.com/bookman7705/my-monster-games/master/car4.glb"
          scale="0.75 0.75 0.75"
          position="0 0 0"
          rotation="0 0 0"
          animation-mixer
        ></a-entity>

      </a-marker>
    
      <a-entity camera></a-entity>
    </a-scene>

    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.0/dist/aframe-extras.min.js"></script>

    <script>
      async function loadMonsterConfig() {
        try {
          const response = await fetch('https://raw.githubusercontent.com/bookman7705/my-monster-games/refs/heads/main/car-config.json');
          const config = await response.json();

          const car = document.querySelector('[gltf-model]');
          car.setAttribute("scale", config.scale);
          car.setAttribute("position", config.position);
          car.setAttribute("rotation", config.rotation);
        } catch (error) {
          console.error('Failed to load car config:', error);
        }
      }

      window.addEventListener('DOMContentLoaded', loadMonsterConfig);
    </script>
  
  </body>
</html>
