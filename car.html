<html lang="en">
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      .version-overlay {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 20px;
        color: red;
        font-family: Arial, sans-serif;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">
    <div class="version-overlay">Version 6.0</div>

    <div class="arjs-loader" id="loader">
      <div>Loading, please wait...</div>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium; shadowMap.enabled: true"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker
        type="pattern"
        url="https://raw.githubusercontent.com/bookman7705/my-monster-games/refs/heads/main/hiro.patt"
      >
        <!-- Ambient Light -->
        <a-light type="ambient" intensity="0.6" color="#ffffff"></a-light>

        <!-- Directional Light (like sunlight) -->
        <a-light
          type="directional"
          color="#ffffff"
          intensity="1.2"
          position="5 10 5"
          castShadow="true"
        ></a-light>

        <!-- Car Model -->
        <a-entity
          gltf-model="https://raw.githubusercontent.com/bookman7705/my-monster-games/master/car4.glb"
          scale="25 25 25"
          position="0 0 0"
          rotation="0 0 0"
          animation-mixer
          shadow="receive: true; cast: true"
        ></a-entity>

        <!-- Glowing Sphere as a Headlight -->
        <a-entity position="1.5 1 -2">
          <a-sphere
            radius="0.075"
            color="#ffffaa"
            material="shader: standard; emissive: #ffffaa; emissiveIntensity: 2"
          ></a-sphere>

          <!-- Point Light to simulate headlight -->
          <a-light
            type="point"
            intensity="1.5"
            distance="3"
            decay="2"
            color="#ffffff"
            position="0 0 0"
            castShadow="false"
          ></a-light>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.0/dist/aframe-extras.min.js"></script>

    <script>
      async function loadMonsterConfig() {
        try {
          const response = await fetch(
            'https://raw.githubusercontent.com/bookman7705/my-monster-games/refs/heads/main/car-config.json'
          );
          const config = await response.json();

          const car = document.querySelector('[gltf-model]');
          car.setAttribute("scale", config.scale);
          car.setAttribute("position", config.position);
          car.setAttribute("rotation", config.rotation);
        } catch (error) {
          console.error('Failed to load car config:', error);
        }
      }

      window.addEventListener('DOMContentLoaded', loadMonsterConfig);
    </script>
  </body>
</html>
