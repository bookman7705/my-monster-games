<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Three.js Water Droplets Dripping Effect</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>

<script id="fragShader" type="x-shader/x-fragment">
uniform sampler2D sceneTexture;
uniform sampler2D normalMap;
uniform sampler2D noiseTexture;
uniform float time;

varying vec2 vUv;

void main() {
    // Speed varies by noise + horizontal offset for randomness
    float speed = 0.1 + texture2D(noiseTexture, vUv * 5.0).r * 0.2;

    // Animate vertical UV with wrap-around (mod) for looping drops
    float offsetY = mod(vUv.y - time * speed + vUv.x * 0.5, 1.0);

    vec2 dripUv = vec2(vUv.x, offsetY);

    // Stretch noise vertically for streak effect
    vec2 noiseUv = vec2(dripUv.x, dripUv.y * 3.0);
    float noiseValue = texture2D(noiseTexture, noiseUv).r;

    // Sharpen droplets with threshold
    float mask = smoothstep(0.6, 0.9, noiseValue);

    // Sample normal map and convert to [-1,1]
    vec3 normal = texture2D(normalMap, dripUv).rgb * 2.0 - 1.0;

    // Distortion only where mask is active
    float distortionStrength = 0.05 * mask;

    // Offset UV for refraction effect
    vec2 offset = normal.xy * distortionStrength;

    // Sample scene texture with distortion
    vec4 sceneColor = texture2D(sceneTexture, vUv + offset);

    // Add highlight only on droplets
    float highlight = clamp(normal.z, 0.0, 1.0) * mask;
    sceneColor.rgb += highlight * 0.2;

    gl_FragColor = sceneColor;
}
</script>

<script id="vertShader" type="x-shader/x-vertex">
varying vec2 vUv;

void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
</script>

<script>
  let scene, camera, renderer;
  let cubeScene, cubeCamera, renderTarget;
  let quadScene, quadCamera;
  let uniforms;

  init();
  animate();

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Background scene: rotating cube
    cubeScene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 5;

    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshNormalMaterial();
    const cube = new THREE.Mesh(geometry, material);
    cubeScene.add(cube);

    // Offscreen render target for the scene texture
    renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
    });

    // Quad scene to render shader pass fullscreen
    quadScene = new THREE.Scene();
    quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const loader = new THREE.TextureLoader();

    const normalMap = loader.load('https://raw.githubusercontent.com/bookman7705/my-monster-games/main/stage/others_0004_normal_opengl_1k.png');
    const noiseTexture = loader.load('https://raw.githubusercontent.com/bookman7705/my-monster-games/main/stage/noisy-background.jpg');

    // Set wrap mode for animation repeat
    normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
    noiseTexture.wrapS = noiseTexture.wrapT = THREE.RepeatWrapping;

    uniforms = {
      sceneTexture: { value: null },
      normalMap: { value: normalMap },
      noiseTexture: { value: noiseTexture },
      time: { value: 0 }
    };

    const shaderMaterial = new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: document.getElementById('vertShader').textContent,
      fragmentShader: document.getElementById('fragShader').textContent,
      transparent: true,
    });

    const plane = new THREE.PlaneGeometry(2, 2);
    const quad = new THREE.Mesh(plane, shaderMaterial);
    quadScene.add(quad);

    window.addEventListener('resize', onWindowResize, false);

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderTarget.setSize(window.innerWidth, window.innerHeight);
    }
  }

  function animate(time = 0) {
    requestAnimationFrame(animate);

    cubeScene.children[0].rotation.x += 0.01;
    cubeScene.children[0].rotation.y += 0.01;

    // Render the background scene into the render target texture
    renderer.setRenderTarget(renderTarget);
    renderer.render(cubeScene, camera);
    renderer.setRenderTarget(null);

    // Update uniforms
    uniforms.sceneTexture.value = renderTarget.texture;
    uniforms.time.value = time * 0.001;

    // Render fullscreen quad with water droplets effect
    renderer.render(quadScene, quadCamera);
  }
</script>

</body>
</html>
