<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebXR AR T-Rex</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- WebXR requires HTTPS (or localhost) on Android -->
<style>
  body { margin: 0; overflow: hidden; }
  #info {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial;
    z-index: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #ARButton {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 24px;
    font-size: 16px;
    z-index: 999;
  }
</style>
</head>
<body>

<div id="info">Tap the button below to <strong>View in AR</strong>, then tap a horizontal surface to place the T-Rex 🦖</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let model, mixer;
const clock = new THREE.Clock();
const loader = new GLTFLoader();

init();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera();

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // AR Button: use optionalFeatures so session starts even if hit-test unavailable (camera still activates)
  const arBtn = ARButton.createButton(renderer, { optionalFeatures: ['hit-test'] });
  document.body.appendChild(arBtn);
  arBtn.textContent = 'View in AR';

  // Light
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Controller for tap events
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  // Reticle (where model will spawn)
  const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  reticle = new THREE.Mesh(geometry, material);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Load T-Rex GLB
  loader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex3.glb',
    function (gltf) {
      model = gltf.scene;
      model.scale.set(0.2, 0.2, 0.2);
      model.rotation.x = 0;
      model.rotation.z = 0;

      if (gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
      }
    },
    undefined,
    (err) => console.error(err)
  );

  renderer.setAnimationLoop(render);
}

function onSelect() {
  if (reticle.visible && model) {
    const clone = model.clone(true);
    clone.position.setFromMatrixPosition(reticle.matrix);
    clone.quaternion.setFromRotationMatrix(reticle.matrix);
    clone.rotation.x = 0;
    clone.rotation.z = 0;
    scene.add(clone);
  }
}

function render(timestamp, frame) {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((refSpace) =>
        session.requestHitTestSource({ space: refSpace })
      ).then((source) => {
        if (source) hitTestSource = source;
      }).catch(() => { /* hit-test not available; AR still works, just no plane placement */ });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && referenceSpace) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      reticle.visible = false;

      for (let hit of hitTestResults) {
        const pose = hit.getPose(referenceSpace);
        if (!pose) continue;
        const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);

        // Filter for horizontal surfaces: up direction of hit pose (Y axis of matrix)
        const normal = new THREE.Vector3(0, 1, 0).transformDirection(matrix);
        if (normal.y > 0.75) {
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          break;
        }
      }
    }
  }

  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);

  renderer.render(scene, camera);
}
</script>
</body>
</html>
