<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Island Viewer AR 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';

let scene, camera, renderer;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let model1 = null, model2 = null;  // Separate variables for each model
let mixer1 = null, mixer2 = null;  // Separate mixers for each model
const clock = new THREE.Clock();

init();
animate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 2);
  scene.add(dirLight);

  // Load the first GLB model (Island)
  const loader1 = new GLTFLoader();
  loader1.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/IslandWorld.glb',
    (gltf) => {
      model1 = gltf.scene;
      model1.scale.set(1, 1, 1);  // scale 1:1
      model1.visible = false;
      scene.add(model1);

      // Animation support for the first model
      if (gltf.animations.length > 0) {
        mixer1 = new THREE.AnimationMixer(model1);
        gltf.animations.forEach((clip) => {
          mixer1.clipAction(clip).play();
        });
      }
    },
    undefined,
    (error) => console.error('Error loading Island model:', error)
  );

  // Load the second GLB model (Pistosaur)
  const loader2 = new GLTFLoader();
  loader2.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/stego.glb',
    (gltf) => {
      model2 = gltf.scene;
      model2.scale.set(1, 1, 1);  // scale 1:1
      model2.position.set(0, 0.25, -5);  // +X = Right, +Y = Up, +Z = ToViewer
      model2.visible = false;
      scene.add(model2);

      // Animation support for the second model
      if (gltf.animations.length > 0) {
        mixer2 = new THREE.AnimationMixer(model2);
        gltf.animations.forEach((clip) => {
          mixer2.clipAction(clip).play();
        });
      }
    },
    undefined,
    (error) => console.error('Error loading Pistosaur model:', error)
  );

  // Reticle setup (indicator for where the model will be placed in AR)
  const geometry = new THREE.RingGeometry(0.25, 0.3, 32);
  geometry.rotateX(-Math.PI / 2);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  reticle = new THREE.Mesh(geometry, material);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // AR Button setup: Makes the page AR-capable (trigger WebXR)
  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test', 'local-floor'] // Features needed for AR
  });
  document.body.appendChild(arButton); // Append AR button to the body

  // Controller setup for interaction
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  // Window resize listener
  window.addEventListener('resize', onWindowResize);
}

function onSelect() {
  if (reticle.visible) {
    // Place model1 based on the reticle's position
    if (model1) {
      model1.visible = true;
      model1.position.setFromMatrixPosition(reticle.matrix);
      model1.quaternion.setFromRotationMatrix(reticle.matrix);
    }

    // Place model2 relative to model1's position
    if (model2 && model1) {
      model2.visible = true;
      // Here, model2's position is relative to model1's position
      model2.position.set(model1.position.x, model1.position.y, model1.position.z);
      model2.quaternion.setFromRotationMatrix(reticle.matrix);
    }
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  renderer.setAnimationLoop(render);
}

function render(timestamp, frame) {
  const delta = clock.getDelta();
  if (mixer1) mixer1.update(delta);
  if (mixer2) mixer2.update(delta);

  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });

      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if (hitTestResults.length) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
