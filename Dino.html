<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-Rex AR 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin: 0; overflow: hidden; }
  .ar-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
    border: 2px solid white;
    border-radius: 8px;
    background: rgba(0,120,215,0.9);
    color: white;
  }
</style>
</head>
<body>

<button class="ar-btn">View in AR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller, reticle;
let hitTestSource = null;
let hitTestRequested = false;
let model;
let currentSession = null;

init();

function init() {

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera();

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const button = document.querySelector('.ar-btn');

  button.addEventListener('click', async () => {

    if (!navigator.xr) {
      alert("WebXR not supported on this device.");
      return;
    }

    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) {
      alert("AR not supported on this device.");
      return;
    }

    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });

    currentSession = session;

    session.addEventListener('end', () => {
      currentSession = null;
      button.style.display = "block";
    });

    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);

    button.style.display = "none";
  });

  // Light
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Controller
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  // Reticle (placement indicator)
  const geometry = new THREE.RingGeometry(0.2, 0.25, 32).rotateX(-Math.PI / 2);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  reticle = new THREE.Mesh(geometry, material);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Load model
  const loader = new GLTFLoader();
  loader.load(
    'https://github.com/bookman7705/my-monster-games/blob/main/RexSmall.glb',
    (gltf) => {
      model = gltf.scene;

      // 🔹 Keep original scale
      model.scale.set(1,1,1);
    }
  );

  renderer.setAnimationLoop(render);
}

function onSelect() {

  if (reticle.visible && model) {

    const clone = model.clone(true);

    clone.position.setFromMatrixPosition(reticle.matrix);
    clone.quaternion.setFromRotationMatrix(reticle.matrix);

    scene.add(clone);
  }
}

function render(timestamp, frame) {

  if (frame) {

    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    if (!hitTestRequested) {

      session.requestReferenceSpace('viewer').then((space) => {
        session.requestHitTestSource({ space: space }).then((source) => {
          hitTestSource = source;
        });
      });

      session.addEventListener('end', () => {
        hitTestRequested = false;
        hitTestSource = null;
      });

      hitTestRequested = true;
    }

    if (hitTestSource) {

      const hitResults = frame.getHitTestResults(hitTestSource);
      reticle.visible = false;

      for (let hit of hitResults) {

        const pose = hit.getPose(referenceSpace);
        if (!pose) continue;

        const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);

        // Only allow horizontal surfaces
        const normal = new THREE.Vector3(0,1,0).transformDirection(matrix);
        if (normal.y > 0.75) {

          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
          break;
        }
      }
    }
  }

  renderer.render(scene, camera);
}

</script>
</body>
</html>
