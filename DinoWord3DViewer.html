<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island Viewer 3D 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; background: #111; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; -webkit-touch-callout: none; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let mixer1, mixer2, mixer3;
const clock = new THREE.Clock();

init();
animate();

function init() {

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const w = window.innerWidth || 1;
  const h = window.innerHeight || 1;

  camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1000);
  camera.position.set(0, 5, 12);

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // 🔧 iOS SAFE RENDERER
  renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    powerPreference: 'low-power',
    failIfMajorPerformanceCrisis: false,
    precision: 'highp'
  });

  // Force high precision (Safari bug workaround)
  renderer.capabilities.getMaxPrecision = () => 'highp';

  renderer.useLegacyLights = true; // more stable on iOS
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  renderer.setClearColor(0x111111, 1);

  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 2, 0);

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Audio
  const listener = new THREE.AudioListener();
  camera.add(listener);

  const oceanSound = new THREE.Audio(listener);
  const audioLoader = new THREE.AudioLoader();

  audioLoader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/ocean-loop-sfx.mp3',
    (buffer) => {
      oceanSound.setBuffer(buffer);
      oceanSound.setLoop(true);
      oceanSound.setVolume(0.6);

      let started = false;
      const startAudio = () => {
        if (started) return;
        started = true;
        oceanSound.play();
        document.removeEventListener('click', startAudio);
        document.removeEventListener('touchend', startAudio);
      };

      document.addEventListener('click', startAudio);
      document.addEventListener('touchend', startAudio);
    }
  );

  const loader = new GLTFLoader();

  // 🔧 Common material precision fix
  function fixMaterials(root) {
    root.traverse((child) => {
      if (child.isMesh && child.material) {
        if (Array.isArray(child.material)) {
          child.material.forEach(mat => {
            mat.precision = 'highp';
            mat.needsUpdate = true;
          });
        } else {
          child.material.precision = 'highp';
          child.material.needsUpdate = true;
        }
      }
    });
  }

  // Load Island
  loader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/IslandWorld.glb',
    (gltf) => {
      const island = gltf.scene;
      scene.add(island);

      fixMaterials(island);

      if (gltf.animations.length) {
        mixer1 = new THREE.AnimationMixer(island);
        gltf.animations.forEach(clip => mixer1.clipAction(clip).play());
      }
    }
  );

  // Load Stego
  loader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/stego.glb',
    (gltf) => {
      const stego = gltf.scene;
      stego.scale.set(1.75, 1.75, 1.75);
      stego.position.set(-1.5, 0, -3.5);
      scene.add(stego);

      fixMaterials(stego);

      if (gltf.animations.length) {
        mixer2 = new THREE.AnimationMixer(stego);
        gltf.animations.forEach(clip => mixer2.clipAction(clip).play());
      }
    }
  );

  // Load Rex
  loader.load(
    'https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb',
    (gltf) => {
      const rex = gltf.scene;
      rex.scale.set(0.4, 0.4, 0.4);
      rex.position.set(3, -0.1, -3.5);
      rex.rotation.y = -Math.PI / 2;
      scene.add(rex);

      fixMaterials(rex);

      if (gltf.animations.length) {
        mixer3 = new THREE.AnimationMixer(rex);
        gltf.animations.forEach(clip => mixer3.clipAction(clip).play());
      }
    }
  );

  window.addEventListener('resize', onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  if (isIOS) setTimeout(onResize, 100);
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w <= 0 || h <= 0) return;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  if (mixer1) mixer1.update(delta);
  if (mixer2) mixer2.update(delta);
  if (mixer3) mixer3.update(delta);

  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
