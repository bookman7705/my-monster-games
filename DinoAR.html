<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marker AR Fixed 6</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #ar-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  /* Camera video as background layer - must be visible behind canvas */
  #ar-container video {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 0 !important;
  }
  /* WebGL canvas on top of video so AR content shows over camera feed */
  #ar-container canvas {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
  }
  #error-overlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.85); color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:20px; font-family:sans-serif; font-size:14px; z-index: 9999;
  }
</style>

<!-- Eruda for mobile console -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<!-- Import maps for ES module loading -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>

<body>
<div id="ar-container"></div>
<div id="error-overlay">Tap the screen to start AR and enable camera</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-image-three";

const AR_CONTAINER = document.getElementById("ar-container");
const errorOverlay = document.getElementById("error-overlay");

function showError(msg) {
  console.error(msg);
  errorOverlay.innerText = msg;
  errorOverlay.style.display = "flex";
}

async function initAR() {
  // Check camera API support
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("Camera API not supported. Use HTTPS or a modern browser.");
    return;
  }

  const IMAGE_TARGET = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind";
  const MODEL_GLTF   = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb";

  try {
    const mindar = new MindARThree({
      container: AR_CONTAINER,
      imageTargetSrc: IMAGE_TARGET,
      uiLoading: "yes",
      uiScanning: "yes",
      alpha: true
    });

    const { renderer, scene, camera } = mindar;

    // Ensure WebGL background is transparent so the camera video can show through
    renderer.setClearColor(0x000000, 0);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x111111, 1);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1,3,2);
    scene.add(dir);

    // Anchor for marker (raw pose from tracker – jittery)
    const anchor = mindar.addAnchor(0);

    // Smoothed group: we lerp/slerp toward anchor pose to reduce jitter
    const SMOOTH_FACTOR = 0.18;
    const smoothedGroup = new THREE.Group();
    scene.add(smoothedGroup);
    const _tempPos = new THREE.Vector3();
    const _tempQuat = new THREE.Quaternion();
    let smoothedInitialized = false;

    // Load GLB model into smoothed group (not anchor) so it uses stabilized pose
    const loader = new GLTFLoader();
    let mixer;
    loader.load(
      MODEL_GLTF,
      gltf => {
        const model = gltf.scene;
        model.scale.set(0.5,0.5,0.5);
        model.position.set(0,0,0);
        model.rotation.set(0, 0, 0);
        smoothedGroup.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }
      },
      undefined,
      err => showError("Failed to load GLB model: " + err)
    );

    const clock = new THREE.Clock();

    // Start MindAR
    await mindar.start();

    // Hide overlay after start
    errorOverlay.style.display = "none";

    // Ensure camera video works on Android/iOS (playsinline required for iOS)
    if (mindar.video) {
      mindar.video.setAttribute("playsinline", "");
      mindar.video.setAttribute("muted", "");
      mindar.video.setAttribute("autoplay", "");
    }
    // Canvas and video stacking is handled by CSS so the camera feed stays visible

    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      // Stabilize: lerp/slerp smoothed group toward raw anchor pose to reduce jitter
      scene.updateMatrixWorld(true);
      anchor.group.getWorldPosition(_tempPos);
      anchor.group.getWorldQuaternion(_tempQuat);
      // Treat target as found when pose is non-zero (MindAR sets matrix to zero when lost)
      const targetFound = _tempPos.lengthSq() > 1e-6;
      if (targetFound) {
        if (!smoothedInitialized) {
          smoothedGroup.position.copy(_tempPos);
          smoothedGroup.quaternion.copy(_tempQuat);
          smoothedInitialized = true;
        } else {
          smoothedGroup.position.lerp(_tempPos, SMOOTH_FACTOR);
          smoothedGroup.quaternion.slerp(_tempQuat, SMOOTH_FACTOR);
        }
        smoothedGroup.visible = true;
      } else {
        smoothedGroup.visible = false;
        smoothedInitialized = false;
      }

      renderer.render(scene, camera);
    });

    // Handle window resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  } catch(err) {
    showError("Unexpected error initializing AR: " + err);
  }
}

// iOS requires a user gesture to start camera
document.body.addEventListener("click", initAR, { once:true });

</script>
</body>
</html>
