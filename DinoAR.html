<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AR Marker Demo 99</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #ar-container { position:absolute; inset:0; }
</style>

<!-- Optional: Eruda for mobile console debugging -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<!-- importmap to map module names to CDN URLs -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>

<body>
<div id="ar-container"></div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-image-three";

const AR_CONTAINER = document.getElementById("ar-container");

// Replace these with your own URLs
const IMAGE_TARGET = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind";
const MODEL_GLTF   = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb";

async function initAR() {
  // Check camera availability
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    console.error("Camera API not supported. Make sure you're on HTTPS.");
    return;
  }

  const mindar = new MindARThree({
    container: AR_CONTAINER,
    imageTargetSrc: IMAGE_TARGET,
    uiLoading: "yes", 
    uiScanning: "yes", 
  });

  const { renderer, scene, camera } = mindar;

  // Lighting
  const hemi = new THREE.HemisphereLight(0xffffff, 0x111111, 1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(1,3,2);
  scene.add(dir);

  // Anchor
  const anchor = mindar.addAnchor(0);

  let mixer;
  const loader = new GLTFLoader();
  loader.load(
    MODEL_GLTF,
    gltf => {
      const model = gltf.scene;
      model.scale.set(0.5, 0.5, 0.5);
      anchor.group.add(model);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
      }
    },
    undefined,
    err => console.error("Failed to load model:", err)
  );

  const clock = new THREE.Clock();

  try {
    await mindar.start();
    renderer.setAnimationLoop(() => {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    });
  } catch(err) {
    console.error("Failed to start AR:", err);
  }
}

// iOS requires a **user interaction** to enable camera
document.body.addEventListener("click", () => {
  initAR();
}, { once: true });

</script>
</body>
</html>
