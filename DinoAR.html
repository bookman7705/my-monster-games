<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Dino AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #ar-container { width:100%; height:100%; position:relative; }
  </style>

  <!-- Three.js and MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <!-- Optional: Eruda for mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>
  <div id="ar-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const { MindARThree } = window.MINDAR.IMAGE;
        if (!MindARThree) {
          console.error("MindAR did not load. Check the CDN script URL.");
          return;
        }

        // Path to your .mind file (generated from your PNG marker)
        const IMAGE_TARGET_SRC = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind";

        // Path to your GLB model
        const MODEL_SRC = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb";

        // Initialize MindAR
        const mindarThree = new MindARThree({
          container: document.getElementById("ar-container"),
          imageTargetSrc: IMAGE_TARGET_SRC,
          uiLoading: "yes",
          uiScanning: "yes",
        });

        const { renderer, scene, camera } = mindarThree;

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111111, 1.0);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);

        // Anchor to attach model to first marker
        const anchor = mindarThree.addAnchor(0);

        // Load GLB
        const loader = new THREE.GLTFLoader();
        let mixer = null;
        loader.load(MODEL_SRC,
          (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.5,0.5,0.5);
            model.position.set(0,0,0);
            anchor.group.add(model);

            // Animation
            if (gltf.animations && gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              const action = mixer.clipAction(gltf.animations[0]);
              action.play();
            }
          },
          undefined,
          (err) => console.error("Failed to load GLB model:", err)
        );

        const clock = new THREE.Clock();

        // Start MindAR & render loop
        await mindarThree.start();
        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();
          if (mixer) mixer.update(delta);
          renderer.render(scene, camera);
        });

        // Handle resize
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

      } catch(err) {
        console.error("AR initialization failed:", err);
      }
    });
  </script>
</body>
</html>
