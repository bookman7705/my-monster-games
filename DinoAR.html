<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marker AR Stable 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body,html{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#ar-container{
  position:absolute;
  inset:0;
}

#ar-container video{
  position:absolute!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  z-index:0!important;
}

#ar-container canvas{
  position:absolute!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
}

#error-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-family:sans-serif;
  z-index:9999;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script type="importmap">
{
 "imports": {
   "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
   "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
   "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
 }
}
</script>

</head>

<body>

<div id="ar-container"></div>
<div id="error-overlay">Tap screen to start AR</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {MindARThree} from "mindar-image-three";

const container=document.querySelector("#ar-container");
const overlay=document.querySelector("#error-overlay");

async function startAR(){

const mindar=new MindARThree({
  container:container,
  imageTargetSrc:"https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind",
  uiScanning:"yes",
  uiLoading:"yes",
  alpha:true
});

const {renderer,scene,camera}=mindar;

renderer.setClearColor(0x000000,0);

const hemi=new THREE.HemisphereLight(0xffffff,0x222222,1);
scene.add(hemi);

const dir=new THREE.DirectionalLight(0xffffff,0.8);
dir.position.set(1,3,2);
scene.add(dir);

const anchor=mindar.addAnchor(0);

const smoothRoot=new THREE.Group();
scene.add(smoothRoot);

let targetVisible=false;

anchor.onTargetFound=()=>{
  targetVisible=true;
};

anchor.onTargetLost=()=>{
  targetVisible=false;
};

const loader=new GLTFLoader();
let mixer;

loader.load(
"https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb",
(gltf)=>{

const model=gltf.scene;

model.scale.set(0.5,0.5,0.5);
model.rotation.set(0,0,0);

smoothRoot.add(model);

if(gltf.animations.length){
  mixer=new THREE.AnimationMixer(model);
  mixer.clipAction(gltf.animations[0]).play();
}

}
);

const clock=new THREE.Clock();

await mindar.start();

overlay.style.display="none";

if(mindar.video){
  mindar.video.setAttribute("playsinline","");
  mindar.video.setAttribute("autoplay","");
  mindar.video.setAttribute("muted","");
}

const SMOOTH=0.2;

renderer.setAnimationLoop(()=>{

const delta=clock.getDelta();

if(mixer) mixer.update(delta);

if(targetVisible){

smoothRoot.visible=true;

smoothRoot.position.lerp(anchor.group.position,SMOOTH);

smoothRoot.quaternion.slerp(anchor.group.quaternion,SMOOTH);

}else{

smoothRoot.visible=false;

}

renderer.render(scene,camera);

});

}

document.body.addEventListener("click",startAR,{once:true});

</script>

</body>
</html>
