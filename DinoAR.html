<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marker AR Fixed Android 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #000;
  }
  #ar-container {
    position: fixed;
    inset: 0;
  }
  #start-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: sans-serif;
    z-index: 10;
  }
</style>

<!-- Import maps -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>

<body>

<div id="ar-container"></div>
<div id="start-overlay">Tap anywhere to start AR</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MindARThree } from "mindar-image-three";

const container = document.querySelector("#ar-container");
const overlay = document.querySelector("#start-overlay");

let mindar;
let mixer;

async function startAR() {

  overlay.style.display = "none";

  // Initialize MindAR with smoothing filters
  mindar = new MindARThree({
    container: container,
    imageTargetSrc: "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind",
    uiLoading: "yes",
    uiScanning: "yes",
    alpha: true,

    // Anti-jitter filters (important for Android)
    filterMinCF: 0.0001,
    filterBeta: 0.01
  });

  const { renderer, scene, camera } = mindar;

  // Important for Android rendering
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  // Lighting
  const hemi = new THREE.HemisphereLight(0xffffff, 0x111111, 1.2);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(1, 3, 2);
  scene.add(dir);

  // Anchor
  const anchor = mindar.addAnchor(0);

  // Load GLB model
  const loader = new GLTFLoader();
  loader.load(
    "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb",
    (gltf) => {
      const model = gltf.scene;

      // Slightly larger scale reduces visible jitter
      model.scale.set(0.7, 0.7, 0.7);

      anchor.group.add(model);

      if (gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(gltf.animations[0]).play();
      }
    },
    undefined,
    (err) => {
      console.error("Model load error:", err);
      alert("Failed to load 3D model.");
    }
  );

  const clock = new THREE.Clock();

  await mindar.start();

  renderer.setAnimationLoop(() => {
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    renderer.render(scene, camera);
  });
}

// Android & iOS require user gesture
document.body.addEventListener("click", startAR, { once: true });

</script>
</body>
</html>
