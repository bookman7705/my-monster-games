<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marker AR Demo 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #ar-container { width:100%; height:100%; position:relative; }
  #error-overlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.85); color:#f55; display:flex;
    align-items:center; justify-content:center; text-align:center; padding:20px; font-family:sans-serif; font-size:14px;
    z-index: 9999; display: none;
  }
</style>

<!-- Three.js + GLTFLoader + MindAR -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<!-- Eruda for mobile console -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</head>
<body>
<div id="ar-container"></div>
<div id="error-overlay"></div>

<script>
(async () => {
  const errorOverlay = document.getElementById("error-overlay");
  function showError(msg) {
    console.error(msg);
    errorOverlay.innerText = msg;
    errorOverlay.style.display = "flex";
  }

  // Check MindAR loaded
  if (!window.MINDAR || !window.MINDAR.IMAGE) {
    showError("MindAR failed to load. Check the CDN URL.");
    return;
  }

  // Check camera support
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("Camera API not supported. Use HTTPS or a modern browser.");
    return;
  }

  const IMAGE_TARGET_SRC = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/mind/Trex.mind"; // replace with your .mind file
  const MODEL_SRC = "https://raw.githubusercontent.com/bookman7705/my-monster-games/main/rex.glb"; // replace with your GLB

  try {
    const { MindARThree } = window.MINDAR.IMAGE;
    const mindarThree = new MindARThree({
      container: document.getElementById("ar-container"),
      imageTargetSrc: IMAGE_TARGET_SRC,
      uiLoading: "yes",
      uiScanning: "yes",
    });

    const { renderer, scene, camera } = mindarThree;

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111111, 1.0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(1, 3, 2);
    scene.add(dirLight);

    // Anchor for marker
    const anchor = mindarThree.addAnchor(0);

    // Load model
    const loader = new THREE.GLTFLoader();
    let mixer = null;
    loader.load(
      MODEL_SRC,
      gltf => {
        const model = gltf.scene;
        model.scale.set(0.5,0.5,0.5);
        model.position.set(0,0,0);
        anchor.group.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }
      },
      undefined,
      err => showError("Failed to load GLB model: " + err)
    );

    const clock = new THREE.Clock();

    // On iOS, camera must start after a user gesture
    const startAR = async () => {
      try {
        await mindarThree.start();
        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();
          if (mixer) mixer.update(delta);
          renderer.render(scene, camera);
        });
      } catch(err) {
        showError("AR initialization failed: " + err);
      }
    };

    // Trigger start on first touch/click
    document.body.addEventListener("click", startAR, { once:true });

    // Optional: resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Prompt user to tap screen
    errorOverlay.style.display = "flex";
    errorOverlay.innerText = "Tap the screen to start AR and enable camera.";
    errorOverlay.style.color = "#fff";

  } catch(err) {
    showError("Unexpected error initializing AR: " + err);
  }
})();
</script>
</body>
</html>
